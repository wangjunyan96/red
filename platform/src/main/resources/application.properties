spring.application.name=platform
server.port=8080

# Embedded H2 (file-based, survives restarts)
spring.datasource.url=jdbc:h2:file:./data/platformdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 web console at /h2-console (dev convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Admin bootstrap + worker device auth (optional)
app.admin.username=admin
app.admin.password=admin123
app.worker.api-key=
